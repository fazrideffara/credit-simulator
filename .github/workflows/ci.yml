name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven & Run Unit Tests
        run: mvn clean verify

      - name: Verify Executable Runner Script
        run: |
          chmod +x ./credit_simulator ./bin/credit_simulator
          ./credit_simulator file_inputs.txt
          ./bin/credit_simulator file_inputs.txt

  image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t credit-simulator:1.0 .

      - name: Push image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Secret Docker Hub belum diisi. Image sudah dibuild, push dilewati."
            exit 0
          fi
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker tag credit-simulator:1.0 "$DOCKERHUB_USERNAME/credit-simulator:1.0"
          docker push "$DOCKERHUB_USERNAME/credit-simulator:1.0"
